<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHOKAIMONO 🌸</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-app: #e0f2fe; 
            --primary: #38bdf8; 
            --secondary: #7dd3fc; 
            --accent: #f472b6; 
            --success: #10b981; 
            --warning: #f59e0b;
            --text-dark: #1e293b;
            --text-gray: #475569;
            --card-bg: #ffffff;
            --font-vi: 'Nunito', sans-serif;
            --font-jp: 'M PLUS Rounded 1c', sans-serif; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font-vi);
            background-color: var(--bg-app);
            background-image: radial-gradient(circle at top right, #f0f9ff 0%, #e0f2fe 100%);
            color: var(--text-dark);
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        .jp-text { font-family: var(--font-jp) !important; }
        .vi-text { font-family: var(--font-vi) !important; }

        .navbar {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: fixed;
            top: 0; width: 100%; z-index: 100;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4);
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
        }

        .navbar h1 { font-family: var(--font-vi); font-size: 26px; font-weight: 900; letter-spacing: 2px; }
        .menu-btn { font-family: var(--font-vi); background: none; border: none; font-size: 30px; color: white; cursor: pointer; }

        .sidebar {
            position: fixed; top: 0; left: -340px; width: 320px; height: 100vh;
            background-color: white; z-index: 200; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 5px 0 25px rgba(0,0,0,0.1); border-top-right-radius: 30px; border-bottom-right-radius: 30px;
            overflow-y: auto;
        }
        .sidebar.active { left: 0; }
        .sidebar-header {
            padding: 45px 20px 30px 20px; background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; border-top-right-radius: 30px; text-align: center; position: relative;
        }
        .close-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; color: white; font-size: 28px;}
        .nav-links { list-style: none; padding: 20px; }
        .nav-links li {
            padding: 18px; margin-bottom: 15px; border-radius: 20px; font-size: 19px; font-weight: 800;
            color: var(--text-dark); display: flex; align-items: center; gap: 15px; transition: 0.2s;
            background: #f0f9ff; border: 2px solid #bae6fd; cursor: pointer; font-family: var(--font-vi);
        }
        .nav-links li:active { background-color: #e0f2fe; transform: scale(0.95); }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); z-index: 150; display: none; opacity: 0; transition: 0.3s; backdrop-filter: blur(2px); }
        .overlay.active { display: block; opacity: 1; }

        .container { margin-top: 100px; padding: 0 15px; max-width: 650px; margin-left: auto; margin-right: auto; }
        section { display: none; animation: fadeIn 0.4s; }
        section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--card-bg); padding: 30px 25px; border-radius: 30px; box-shadow: 0 10px 40px rgba(56, 189, 248, 0.15); border: 3px solid #f0f9ff; }
        .input-group { margin-bottom: 22px; }
        .input-group label { display: block; font-size: 18px; font-weight: 900; color: var(--primary); margin-bottom: 10px; font-family: var(--font-vi);}
        input, select {
            width: 100%; padding: 18px; border: 2px solid #bae6fd; border-radius: 20px; font-size: 20px;
            font-family: var(--font-vi); transition: 0.3s; background-color: #f8fafc; color: var(--text-dark); font-weight: 700;
        }
        input.jp-input { font-family: var(--font-jp); font-size: 22px; font-weight: 700; }
        input:focus, select:focus { outline: none; border-color: var(--accent); background-color: white; box-shadow: 0 0 0 5px rgba(244, 114, 182, 0.15); }
        
        button { font-family: var(--font-vi) !important; }
        button.btn-submit {
            width: 100%; padding: 20px; background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; border: none; border-radius: 20px; font-size: 22px; font-weight: 900; cursor: pointer;
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4); margin-top: 15px; transition: 0.2s; letter-spacing: 1px;
        }
        button.btn-submit:active { transform: scale(0.95); }

        .section-title { font-size: 24px; font-weight: 900; color: var(--primary); margin-bottom: 15px; text-align: center; text-transform: uppercase; letter-spacing: 1px;}
        
        /* === GIAO DIỆN LỊCH === */
        .calendar-wrapper { background: white; border-radius: 25px; padding: 20px; box-shadow: 0 6px 20px rgba(56, 189, 248, 0.15); border: 2px solid #e0f2fe; margin-bottom: 25px; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .calendar-header button { background: var(--e0f2fe); border: none; font-size: 20px; color: var(--primary); width: 40px; height: 40px; border-radius: 12px; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .calendar-header button:active { transform: scale(0.9); }
        .calendar-title { font-size: 20px; font-weight: 900; color: var(--text-dark); }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; }
        .day-name { font-weight: 900; color: var(--text-gray); font-size: 14px; margin-bottom: 5px; }
        .day-cell { padding: 12px 0; border-radius: 12px; font-size: 16px; font-weight: 700; background: #f8fafc; color: var(--text-gray); cursor: pointer; transition: 0.3s; position: relative; border: 2px solid transparent;}
        .day-cell.empty { background: transparent; pointer-events: none; }
        
        .day-cell.has-data { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(56, 189, 248, 0.4); }
        .day-cell.has-data.tab-moi { background: var(--accent); box-shadow: 0 4px 10px rgba(244, 114, 182, 0.4); }
        .day-cell.selected { border-color: #1e293b; transform: scale(1.1); z-index: 10; font-weight: 900;}

        /* HIỂN THỊ TỪ VỰNG */
        .selected-date-title { font-size: 20px; font-weight: 900; color: var(--text-dark); margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px dashed #bae6fd; display: none;}

        .word-card { background: white; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; border-left: 6px solid var(--accent); overflow: hidden; position: relative; transition: all 0.3s;}
        .word-card:last-child { margin-bottom: 0; }
        
        .word-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .w-jp { font-size: 34px; font-weight: 900; color: var(--text-dark); display: block; line-height: 1.2;}
        .w-new-badge { font-size: 14px; background: #fef08a; color: #ca8a04; padding: 4px 8px; border-radius: 10px; font-weight: 800; margin-left: 10px; vertical-align: middle; font-family: var(--font-vi);}
        .w-done-badge { font-size: 14px; background: #d1fae5; color: #047857; padding: 4px 8px; border-radius: 10px; font-weight: 800; margin-left: 10px; vertical-align: middle; font-family: var(--font-vi);}
        
        .word-card.open .word-header .toggle-icon { transform: rotate(180deg); color: var(--accent); }

        .word-body {
            max-height: 0; overflow: hidden; transition: max-height 0.4s ease, padding 0.3s ease;
            background-color: #ffffff; border-top: 1px dashed transparent; padding: 0 20px;
        }
        .word-card.open .word-body { max-height: 1500px; padding: 20px; border-top-color: #e2e8f0; }

        .detail-item { font-size: 20px; margin-bottom: 16px; line-height: 1.6; color: var(--text-dark); }
        .detail-item span.label { font-weight: 900; color: var(--primary); display: inline-block; min-width: 100px; font-size: 18px; text-transform: uppercase; font-family: var(--font-vi);}
        
        .action-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .btn-action {
            width: 100%; padding: 15px; border: none; border-radius: 15px; font-size: 18px; 
            font-weight: 900; cursor: pointer; transition: 0.2s;
        }
        .btn-success { background: var(--success); color: white; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
        .btn-undo { background: #e2e8f0; color: #475569; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-warning { background: var(--warning); color: white; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); }
        .btn-link { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4); }
        .btn-action:active { transform: scale(0.97); }

        .num-bullet { color: var(--accent); font-weight: 900; font-size: 22px; margin-right: 5px; font-family: var(--font-vi);}

        .speaker-box { display: flex; align-items: center; gap: 12px; }
        .speaker-btn {
            background: #e0f2fe; color: var(--primary); border: none; width: 45px; height: 45px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 10px rgba(56, 189, 248, 0.2); font-size: 22px;
        }
        .speaker-btn:active { transform: scale(0.85); background: var(--primary); color: white;}

        #backToTop {
            position: fixed; bottom: 30px; right: 25px; width: 60px; height: 60px;
            background: var(--accent); color: white; border: none; border-radius: 50%;
            font-size: 26px; box-shadow: 0 6px 20px rgba(244, 114, 182, 0.4); display: none; z-index: 99;
            align-items: center; justify-content: center; transition: 0.3s; cursor: pointer;
        }
        #backToTop:active { transform: scale(0.9); }

        /* DANH SÁCH CHỜ THÊM TỪ MỚI (STAGING) */
        .staging-list { margin-top: 15px; list-style: none; padding: 0; }
        .staging-item {
            background: #ffffff; border: 2px dashed #bae6fd; border-radius: 20px;
            padding: 15px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 12px;
        }
        .staging-info { font-size: 18px; font-weight: 700; color: var(--text-dark); line-height: 1.4; }
        
        .staging-actions { display: flex; gap: 8px; flex-wrap: wrap;}
        .staging-btn {
            flex: 1; min-width: 30%; padding: 12px 8px; border: none; border-radius: 12px; font-weight: 800;
            cursor: pointer; font-family: var(--font-vi); font-size: 15px; transition: 0.2s; text-align: center;
        }
        .staging-btn-del { background: #fee2e2; color: #ef4444; }
        .staging-btn-del:active { background: #fca5a5; transform: scale(0.95); }
        .staging-btn-undo { background: #e0f2fe; color: #0284c7; }
        .staging-btn-undo:active { background: #bae6fd; transform: scale(0.95); }
        .staging-btn-copy { background: #dcfce7; color: #16a34a; }
        .staging-btn-copy:active { background: #bbf7d0; transform: scale(0.95); }

        .loading-screen { text-align: center; padding: 60px 20px; color: var(--primary); font-size: 22px; font-weight: 900; font-family: var(--font-vi);}

    </style>
</head>
<body>

    <nav class="navbar">
        <button class="menu-btn" onclick="toggleMenu()">🎀</button>
        <h1>SHOKAIMONO</h1>
        <div style="width: 30px;"></div>
    </nav>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="close-btn" onclick="toggleMenu()">✖</button>
            <h2 style="font-size: 26px; font-weight: 900; font-family: var(--font-vi);">MENU ☁️</h2>
        </div>
        <ul class="nav-links">
            <li onclick="loadVocab('VOCAB', 'VOCAB')">🌸 VOCAB</li>
            <li onclick="loadVocab('ニュース', 'ニュース')">💮  ニュース</li>
            <li onclick="loadVocab('Mới_VOCAB', 'VOCAB')">🏵️ Mới VOCAB</li>
            <li onclick="loadVocab('Mới_ニュース', 'ニュース')">🏵️ Mới ニュース</li>
            <li onclick="switchTab('addSection')">🌱 Thêm từ mới</li>
        </ul>
    </div>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <main class="container">
        
        <!-- SECTION THÊM TỪ MỚI CÓ DANH SÁCH CHỜ -->
        <section id="addSection">
            <div class="card">
                <div class="input-group">
                    <label>🌸 Chọn nơi lưu (Kho gốc)</label>
                    <select id="tabSelect">
                        <option value="VOCAB">🌸 VOCAB</option>
                        <option value="ニュース">💮 ニュース</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>🇯🇵 Từ vựng (Kanji / Kana / Tiếng Anh)</label>
                    <input type="text" id="word" class="jp-input" placeholder="VD: 会社 hoặc Hello">
                </div>
                <div class="input-group">
                    <label>📝 Câu ví dụ</label>
                    <input type="text" id="example" class="jp-input" placeholder="VD: 1. Ví dụ một. 2. Ví dụ hai.">
                </div>
                <div class="input-group">
                    <label>🇻🇳 Ý nghĩa</label>
                    <input type="text" id="meaning" class="vi-text" placeholder="VD: Công ty">
                </div>
                <div class="input-group">
                    <label>🏷️ Loại từ (Danh/Động/Tính)</label>
                    <input type="text" id="type" class="vi-text" placeholder="VD: Danh từ">
                </div>
                <div class="input-group">
                    <label>🗣️ Cách đọc</label>
                    <input type="text" id="pronun" class="jp-input" placeholder="VD: かいしゃ">
                </div>
                
                <button class="btn-submit" style="background: #e0f2fe; color: var(--primary); box-shadow: none; border: 2px solid var(--primary);" onclick="addStagedWord()">➕ Thêm vào danh sách chờ</button>

                <!-- KHU VỰC DANH SÁCH CHỜ LƯU -->
                <div id="stagingArea" style="display: none; margin-top: 35px;">
                    <h4 style="font-weight: 900; color: var(--text-dark); margin-bottom: 10px; font-size: 20px;">📝 Các từ chuẩn bị lưu:</h4>
                    
                    <!-- Nút copy tất cả -->
                    <button class="btn-submit" style="background: #fef08a; color: #ca8a04; margin-top: 5px; margin-bottom: 15px; box-shadow: none; border: 2px dashed #facc15; font-size: 18px;" onclick="copyAllStagedWords()">📋 COPY TẤT CẢ TỪ MỚI</button>
                    
                    <ul id="stagingList" class="staging-list"></ul>
                    
                    <button class="btn-submit" onclick="saveAllToSheet()">🌸 LƯU TẤT CẢ VÀO SỔ TAY 🌸</button>
                </div>
            </div>
        </section>

        <!-- SECTION HIỂN THỊ TỪ VỰNG KHO -->
        <section id="listSection" class="active">
            <h3 id="listTitle" class="section-title">🌸 Kho VOCAB</h3>
            
            <div class="calendar-wrapper">
                <div class="calendar-header">
                    <button onclick="changeMonth(-1)"><i class="fas fa-chevron-left"></i></button>
                    <div class="calendar-title" id="calMonthYear">Tháng / Năm</div>
                    <button onclick="changeMonth(1)"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="calendar-grid" id="calGrid"></div>
            </div>

            <div id="selectedDateTitle" class="selected-date-title"></div>
            <div id="wordListContainer"></div>
        </section>

    </main>

    <button id="backToTop" onclick="scrollToTop()">🌸</button>

    <script>
        // === LINK APP SCRIPT CỦA BẠN ===
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw9HeNZEnE-kqo-wJePWhnoUiqin3kQbcf9LX4WppLtfwgPEwM5BxXlAkAVtfc5MyJi/exec'; 

        let currentViewMode = "VOCAB"; 
        let currentSourceTab = "VOCAB"; 
        let globalGroupedData = {}; 
        
        let displayMonth = new Date().getMonth(); 
        let displayYear = new Date().getFullYear();
        let targetScrollWord = null; 
        let targetScrollDate = null;

        // MẢNG LƯU DANH SÁCH TỪ VỰNG TẠM THỜI (Lấy từ localStorage để không bị mất khi load lại)
        let stagedWords = JSON.parse(localStorage.getItem('shokaimono_staged_words')) || [];

        window.onload = function() {
            loadVocab('VOCAB', 'VOCAB');
            renderStagedWords(); // Hiển thị lại danh sách chờ nếu có data lưu trữ
        };

        // Hàm hỗ trợ lưu vào localStorage
        function saveStagedToStorage() {
            localStorage.setItem('shokaimono_staged_words', JSON.stringify(stagedWords));
        }

        function toggleMenu() {
            document.getElementById("sidebar").classList.toggle("active");
            document.getElementById("overlay").classList.toggle("active");
        }

        function switchTab(sectionId) {
            document.getElementById('addSection').classList.remove('active');
            document.getElementById('listSection').classList.remove('active');
            document.getElementById(sectionId).classList.add('active');
            if(document.getElementById("sidebar").classList.contains("active")) toggleMenu();
        }

        // ==========================================
        // TÍNH NĂNG THÊM TỪ VÀO DANH SÁCH CHỜ
        // ==========================================
        function addStagedWord() {
            let tab = document.getElementById('tabSelect').value;
            let word = document.getElementById('word').value.trim();
            let meaning = document.getElementById('meaning').value.trim();
            let type = document.getElementById('type').value.trim();
            let pronun = document.getElementById('pronun').value.trim();
            let example = document.getElementById('example').value.trim();

            if (!word || !meaning) {
                alert("Viết xíu Từ vựng với Ý nghĩa vào đi bạn ơi! 🌸"); return;
            }

            // Thêm vào mảng chờ
            stagedWords.push({ tab, word, meaning, type, pronun, example });
            
            // Lưu ngay vào localStorage
            saveStagedToStorage();
            
            // Xóa form nhập
            document.getElementById('word').value = "";
            document.getElementById('meaning').value = "";
            document.getElementById('type').value = "";
            document.getElementById('pronun').value = "";
            document.getElementById('example').value = "";

            renderStagedWords();
        }

        function renderStagedWords() {
            let list = document.getElementById('stagingList');
            let area = document.getElementById('stagingArea');

            if (stagedWords.length === 0) {
                area.style.display = "none";
                list.innerHTML = "";
                return;
            }

            area.style.display = "block";
            let html = "";
            stagedWords.forEach((item, index) => {
                html += `
                <li class="staging-item">
                    <div class="staging-info">
                        <span class="num-bullet">${index + 1}.</span> 
                        <span class="jp-text" style="color: var(--primary); font-size: 22px;">${item.word}</span> 
                        <span style="font-size: 16px; color: var(--text-gray);">(${item.meaning})</span><br>
                        <span style="font-size: 14px; color: var(--text-gray);">Kho: ${item.tab}</span>
                    </div>
                    <div class="staging-actions">
                        <button class="staging-btn staging-btn-undo" onclick="undoStaged(${index})">↩️ Sửa</button>
                        <button class="staging-btn staging-btn-copy" onclick="copySingleWord(${index})">📋 Copy</button>
                        <button class="staging-btn staging-btn-del" onclick="deleteStaged(${index})">❌ Xóa</button>
                    </div>
                </li>`;
            });
            list.innerHTML = html;
        }

        // Bấm Copy 1 từ
        function copySingleWord(index) {
            let item = stagedWords[index];
            let copyText = `${item.word} - ${item.meaning}`;
            navigator.clipboard.writeText(copyText).then(() => {
                alert("📋 Đã copy: " + copyText);
            });
        }

        // Bấm Copy Tất cả từ vựng chờ
        function copyAllStagedWords() {
            if (stagedWords.length === 0) return;
            
            let copyText = stagedWords.map((item, idx) => `${idx + 1}. ${item.word} - ${item.meaning}`).join('\n');
            navigator.clipboard.writeText(copyText).then(() => {
                alert(`📋 Đã copy toàn bộ ${stagedWords.length} từ vựng mới!`);
            });
        }

        // Bấm Xóa -> Biến mất khỏi danh sách chờ, cập nhật localStorage
        function deleteStaged(index) {
            stagedWords.splice(index, 1);
            saveStagedToStorage();
            renderStagedWords();
        }

        // Bấm Sửa -> Xóa khỏi danh sách chờ, bưng ngược lại lên form nhập để sửa
        function undoStaged(index) {
            let item = stagedWords[index];
            stagedWords.splice(index, 1);
            saveStagedToStorage();
            
            document.getElementById('tabSelect').value = item.tab;
            document.getElementById('word').value = item.word;
            document.getElementById('meaning').value = item.meaning;
            document.getElementById('type').value = item.type;
            document.getElementById('pronun').value = item.pronun;
            document.getElementById('example').value = item.example;

            renderStagedWords();
        }

        // BẤM LƯU TẤT CẢ LÊN GOOGLE SHEET
        async function saveAllToSheet() {
            if (stagedWords.length === 0) return;

            let btn = document.querySelector('#stagingArea .btn-submit:last-child');
            let originalText = btn.innerHTML;
            btn.innerHTML = '⏳ ĐANG LƯU HẾT LÊN SHEET...';
            btn.disabled = true;

            try {
                // Xử lý gửi tuần tự để đảm bảo Sheet nhận đủ, không bị đụng độ
                for (let item of stagedWords) {
                    let bodyData = `action=add&tab=${encodeURIComponent(item.tab)}&word=${encodeURIComponent(item.word)}&meaning=${encodeURIComponent(item.meaning)}&type=${encodeURIComponent(item.type)}&pronun=${encodeURIComponent(item.pronun)}&example=${encodeURIComponent(item.example)}`;
                    
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: bodyData
                    });
                }
                
                alert("🎉 Đã lưu thành công tất cả từ vựng vào Sổ tay!");
                stagedWords = []; // Dọn sạch mảng
                saveStagedToStorage(); // Dọn luôn localStorage
                renderStagedWords(); // Ẩn danh sách
                
            } catch(err) {
                alert("Mạng lỗi rồi, có thể lưu chưa hết đâu. Thử lại nhé!");
            }

            btn.innerHTML = originalText;
            btn.disabled = false;
        }

        // ==========================================
        // CÁC HÀM HIỂN THỊ TỪ VỰNG KHO NHƯ CŨ
        // ==========================================

        function loadVocab(viewMode, sourceTab) {
            currentViewMode = viewMode; 
            currentSourceTab = sourceTab;
            switchTab('listSection');
            
            let displayTitle = viewMode.startsWith("Mới") ? `🏵️ TAB MỚI: ${sourceTab}` : `🌸 KHO: ${sourceTab}`;
            document.getElementById('listTitle').innerText = displayTitle;
            
            document.getElementById('wordListContainer').innerHTML = `<div class="loading-screen">⏳<br>Đang tải dữ liệu...</div>`;
            document.getElementById('selectedDateTitle').style.display = 'none';

            fetch(SCRIPT_URL + "?tab=" + sourceTab)
                .then(res => res.json())
                .then(data => {
                    processData(data, viewMode, sourceTab);
                }).catch(err => {
                    document.getElementById('wordListContainer').innerHTML = `<p style="text-align:center; color: red; font-size:20px;">Lỗi mạng. Tải lại trang dùm cái!</p>`;
                });
        }

        function formatLineBreaks(text) {
            if (!text) return "";
            let formatted = text.replace(/(?:\s|^)(\d+[\.\)])/g, '<br><br><span class="num-bullet">$1</span>');
            formatted = formatted.replace(/^(<br>)+/, '').trim();
            return formatted;
        }

        function processData(data, viewMode, sourceTab) {
            globalGroupedData = {}; 
            
            for (let i = 1; i < data.length; i++) {
                let row = data[i];
                if (!row[0]) continue; 
                
                let status = row[6] || ""; 
                
                if (viewMode.startsWith("Mới")) {
                    if (status !== "Cần ôn") continue; 
                }

                let rawDate = row[2] ? row[2].toString().substring(0, 10) : "Khác";
                
                let dateStr = rawDate;
                if (rawDate !== "Khác") {
                    let parts = rawDate.includes('/') ? rawDate.split('/') : rawDate.split('-');
                    if (parts.length >= 3) {
                        let d = parts[0]; let m = parts[1]; let y = parts[2];
                        if (rawDate.includes('/')) {
                            d = parts[0]; m = parts[1]; y = parts[2];
                        } else {
                            y = parts[0]; m = parts[1]; d = parts[2]; 
                        }
                        dateStr = `${d.padStart(2,'0')}/${m.padStart(2,'0')}/${y}`;
                    }
                }

                if (!globalGroupedData[dateStr]) globalGroupedData[dateStr] = [];

                globalGroupedData[dateStr].push({
                    word: row[0] || "",
                    meaning: formatLineBreaks(row[1] || ""), 
                    type: row[3] || "---",
                    pronun: row[4] || "---",
                    example: formatLineBreaks(row[5] || ""),
                    status: status
                });
            }

            document.getElementById('wordListContainer').innerHTML = ""; 

            if (targetScrollDate) {
                let parts = targetScrollDate.split('/');
                if(parts.length === 3) {
                    displayMonth = parseInt(parts[1]) - 1;
                    displayYear = parseInt(parts[2]);
                }
            } else {
                displayMonth = new Date().getMonth(); 
                displayYear = new Date().getFullYear();
            }

            renderCalendar(displayMonth, displayYear);

            if (targetScrollDate && targetScrollWord) {
                showWordsForDate(targetScrollDate, null);
            }
        }

        function renderCalendar(month, year) {
            const monthNames = ["Tháng 1", "Tháng 2", "Tháng 3", "Tháng 4", "Tháng 5", "Tháng 6", "Tháng 7", "Tháng 8", "Tháng 9", "Tháng 10", "Tháng 11", "Tháng 12"];
            document.getElementById('calMonthYear').innerText = `🌸 ${monthNames[month]} / ${year}`;

            let firstDay = new Date(year, month, 1).getDay(); 
            let daysInMonth = new Date(year, month + 1, 0).getDate();

            let grid = document.getElementById('calGrid');
            grid.innerHTML = '';

            const dayNames = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
            dayNames.forEach(d => {
                grid.innerHTML += `<div class="day-name">${d}</div>`;
            });

            for (let i = 0; i < firstDay; i++) {
                grid.innerHTML += `<div class="day-cell empty"></div>`;
            }

            for (let d = 1; d <= daysInMonth; d++) {
                let dayStr = d.toString().padStart(2, '0');
                let monthStr = (month + 1).toString().padStart(2, '0');
                let fullDateStr = `${dayStr}/${monthStr}/${year}`;

                let hasData = globalGroupedData[fullDateStr] && globalGroupedData[fullDateStr].length > 0;
                
                let cls = "day-cell";
                if (hasData) {
                    cls += currentViewMode.startsWith("Mới") ? " has-data tab-moi" : " has-data";
                }

                if (targetScrollDate === fullDateStr) {
                    cls += " selected";
                }

                grid.innerHTML += `<div class="${cls}" onclick="showWordsForDate('${fullDateStr}', this)">${d}</div>`;
            }
        }

        function changeMonth(step) {
            displayMonth += step;
            if (displayMonth < 0) { displayMonth = 11; displayYear--; }
            else if (displayMonth > 11) { displayMonth = 0; displayYear++; }
            renderCalendar(displayMonth, displayYear);
            document.getElementById('wordListContainer').innerHTML = "";
            document.getElementById('selectedDateTitle').style.display = 'none';
        }

        function showWordsForDate(dateStr, cellElement) {
            document.querySelectorAll('.day-cell').forEach(el => el.classList.remove('selected'));
            if (cellElement) {
                cellElement.classList.add('selected');
            } else {
                let d = parseInt(dateStr.split('/')[0]);
                let cells = document.querySelectorAll('.day-cell:not(.empty)');
                cells.forEach(c => {
                    if (parseInt(c.innerText) === d) c.classList.add('selected');
                });
            }

            let words = globalGroupedData[dateStr] || [];
            let container = document.getElementById('wordListContainer');
            let titleArea = document.getElementById('selectedDateTitle');

            if (words.length === 0) {
                titleArea.style.display = "block";
                titleArea.innerHTML = `📅 Ngày ${dateStr} <br><span style="font-size:16px; color:var(--text-gray); font-weight:normal;">(Không có từ nào ở đây)</span>`;
                container.innerHTML = "";
                return;
            }

            titleArea.style.display = "block";
            titleArea.innerHTML = `📅 Từ vựng Ngày ${dateStr} <span style="font-size:16px; color:#94a3b8;">(${words.length} từ)</span>`;

            let wordsReversed = [...words].reverse();
            let html = "";

            wordsReversed.forEach(w => {
                let badgeHtml = "";
                let actionButtonsHtml = "";
                let safeWordAttr = w.word.replace(/"/g, '&quot;'); 

                if (currentViewMode.startsWith("Mới")) {
                    actionButtonsHtml += `<button class="btn-action btn-success" onclick="updateStatus('${safeWordAttr}', '', this, '${currentViewMode}', '${dateStr}')">✅ Đã thuộc (Xóa khỏi Tab Mới)</button>`;
                    actionButtonsHtml += `<button class="btn-action btn-link" onclick="jumpToOrigin('${safeWordAttr}', '${currentSourceTab}', '${dateStr}')">🔗 Đi tới gốc từ vựng này</button>`;
                } else {
                    if (w.status === "Cần ôn") {
                        badgeHtml = `<span class="w-new-badge">Đang ở Tab Mới</span>`;
                        actionButtonsHtml += `<button class="btn-action btn-undo" onclick="updateStatus('${safeWordAttr}', '', this, '${currentViewMode}', '${dateStr}')">❌ Bỏ khỏi Tab Mới</button>`;
                    } else {
                        actionButtonsHtml += `<button class="btn-action btn-warning" onclick="updateStatus('${safeWordAttr}', 'Cần ôn', this, '${currentViewMode}', '${dateStr}')">⭐ Thêm vào Tab Mới</button>`;
                    }
                }

                html += `
                <div class="word-card" data-word="${safeWordAttr}">
                    <div class="word-header" onclick="toggleParent(this, 'word-card')">
                        <div>
                            <span class="w-jp jp-text">${w.word} ${badgeHtml}</span>
                        </div>
                        <span class="toggle-icon">🔽</span>
                    </div>
                    <div class="word-body">
                        <div class="detail-item speaker-box">
                            <span class="label">Đọc:</span> <span class="jp-text" style="font-size: 24px; font-weight:900; color:var(--primary);">${w.pronun}</span>
                            ${w.pronun !== "---" ? `<button class="speaker-btn" onclick="detectLangAndSpeak('${safeWordAttr}')">🔊</button>` : ''}
                        </div>
                        <div class="detail-item"><span class="label">Từ loại:</span> <span class="vi-text" style="font-weight:700;">${w.type}</span></div>
                        <div class="detail-item"><span class="label">Ví dụ:</span> <div class="jp-text" style="font-size: 22px; padding-top: 5px;">${w.example}</div></div>
                        
                        <hr style="border-top: 2px dashed #bae6fd; margin: 20px 0;">
                        <div class="detail-item"><span class="label" style="color:var(--accent);">Ý nghĩa:</span> <span class="vi-text" style="font-weight:800;">${w.meaning}</span></div>
                        
                        <div class="action-buttons">
                            ${actionButtonsHtml}
                        </div>
                    </div>
                </div>`;
            });

            container.innerHTML = html;

            if (targetScrollWord) {
                setTimeout(() => {
                    let safeWord = targetScrollWord.replace(/"/g, '\\"');
                    let card = document.querySelector(`.word-card[data-word="${safeWord}"]`);
                    if (card) {
                        card.classList.add('open');
                        card.scrollIntoView({behavior: 'smooth', block: 'center'});
                        card.style.boxShadow = "0 0 25px var(--warning)";
                        card.style.borderLeft = "6px solid var(--warning)";
                        setTimeout(() => {
                            card.style.boxShadow = "0 4px 15px rgba(0,0,0,0.05)";
                            card.style.borderLeft = "6px solid var(--accent)";
                        }, 3000);
                    }
                    targetScrollWord = null; 
                    targetScrollDate = null;
                }, 100);
            }
        }

        function jumpToOrigin(word, sourceTab, dateStr) {
            targetScrollWord = word;
            targetScrollDate = dateStr;
            loadVocab(sourceTab, sourceTab); 
        }

        function updateStatus(wordToMark, newStatus, btnElement, viewMode, dateStr) {
            let originalText = btnElement.innerText;
            btnElement.innerHTML = '⏳ Đang xử lý...';
            btnElement.disabled = true;

            let bodyData = `action=update_status&word=${encodeURIComponent(wordToMark)}&status=${encodeURIComponent(newStatus)}`;

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: bodyData
            }).then(response => {
                if (viewMode.startsWith("Mới")) {
                    let card = btnElement.closest('.word-card');
                    card.style.transition = "0.4s";
                    card.style.opacity = "0";
                    setTimeout(() => card.remove(), 400);

                    let targetArr = globalGroupedData[dateStr];
                    if(targetArr) {
                        for(let i=0; i<targetArr.length; i++){
                            if(targetArr[i].word === wordToMark){
                                targetArr.splice(i, 1); break;
                            }
                        }
                        if(targetArr.length === 0) renderCalendar(displayMonth, displayYear); 
                    }

                } else {
                    let actionBox = btnElement.closest('.action-buttons');
                    let badgeArea = btnElement.closest('.word-card').querySelector('.word-header div');
                    let safeWordAttr = wordToMark.replace(/"/g, '&quot;');
                    
                    if (newStatus === "Cần ôn") {
                        badgeArea.innerHTML = `<span class="w-jp jp-text">${wordToMark} <span class="w-new-badge">Đang ở Tab Mới</span></span>`;
                        actionBox.innerHTML = `<button class="btn-action btn-undo" onclick="updateStatus('${safeWordAttr}', '', this, '${viewMode}', '${dateStr}')">❌ Bỏ khỏi Tab Mới</button>`;
                    } else {
                        badgeArea.innerHTML = `<span class="w-jp jp-text">${wordToMark}</span>`;
                        actionBox.innerHTML = `<button class="btn-action btn-warning" onclick="updateStatus('${safeWordAttr}', 'Cần ôn', this, '${viewMode}', '${dateStr}')">⭐ Thêm vào Tab Mới</button>`;
                    }
                }
            }).catch(err => {
                alert("Lỗi mạng rồi. Thử lại sau nha!");
                btnElement.innerHTML = originalText;
                btnElement.disabled = false;
            });
        }

        function toggleParent(headerEl, parentClass) {
            let parentBox = headerEl.closest('.' + parentClass);
            parentBox.classList.toggle('open');
        }

        function detectLangAndSpeak(text) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            
            if (currentSourceTab === "VOCAB") {
                utterance.lang = 'en-US'; 
            } else if (currentSourceTab === "ニュース") {
                utterance.lang = 'ja-JP'; 
            } 
            
            utterance.rate = 0.85; 
            window.speechSynthesis.speak(utterance);
        }

        window.onscroll = function() {
            let backBtn = document.getElementById("backToTop");
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                backBtn.style.display = "flex";
            } else {
                backBtn.style.display = "none";
            }
        };
        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
    </script>
</body>
</html>
