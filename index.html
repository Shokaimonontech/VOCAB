<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHOKAIMONO</title>
    <!-- Thư viện Icon -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Font chữ chuẩn cho Tiếng Việt và Tiếng Nhật -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-app: #f4f7f6;
            --primary: #00b09b; /* Xanh bạc hà tươi tắn */
            --secondary: #96c93d; /* Xanh lá non */
            --text-dark: #2d3436;
            --text-gray: #636e72;
            --card-bg: #ffffff;
            --font-vi: 'Nunito', sans-serif;
            --font-jp: 'Noto Sans JP', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font-vi);
            background-color: var(--bg-app);
            color: var(--text-dark);
            overflow-x: hidden;
            padding-bottom: 40px;
        }

        .jp-text { font-family: var(--font-jp) !important; }
        .vi-text { font-family: var(--font-vi) !important; }

        /* NAVBAR */
        .navbar {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: fixed;
            top: 0; width: 100%; z-index: 100;
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.3);
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        .navbar h1 { font-size: 24px; font-weight: 800; letter-spacing: 1.5px; }
        .menu-btn { background: none; border: none; font-size: 26px; color: white; cursor: pointer; }

        /* MENU SIDEBAR */
        .sidebar {
            position: fixed; top: 0; left: -320px; width: 300px; height: 100vh;
            background-color: white; z-index: 200; transition: 0.4s ease-in-out;
            box-shadow: 5px 0 20px rgba(0,0,0,0.15); border-top-right-radius: 25px; border-bottom-right-radius: 25px;
        }
        .sidebar.active { left: 0; }
        .sidebar-header {
            padding: 40px 20px 30px 20px; background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; border-top-right-radius: 25px; text-align: center; position: relative;
        }
        .close-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; color: white; font-size: 26px;}
        .nav-links { list-style: none; padding: 20px 15px; }
        .nav-links li {
            padding: 18px 20px; margin-bottom: 12px; border-radius: 15px; font-size: 18px; font-weight: 700;
            color: var(--text-dark); display: flex; align-items: center; gap: 15px; transition: 0.2s;
            background: #f8fafc; border: 1px solid #edf2f7;
        }
        .nav-links li i { font-size: 22px; color: var(--primary); }
        .nav-links li:active { background-color: #e2e8f0; transform: scale(0.98); }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 150; display: none; opacity: 0; transition: 0.3s; }
        .overlay.active { display: block; opacity: 1; }

        /* CONTAINER CHUNG */
        .container { margin-top: 90px; padding: 0 15px; max-width: 600px; margin-left: auto; margin-right: auto; }
        section { display: none; animation: fadeIn 0.4s; }
        section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* KHU VỰC THÊM TỪ */
        .card { background: var(--card-bg); padding: 25px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #f0f0f0; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 16px; font-weight: 800; color: var(--text-dark); margin-bottom: 8px; }
        input, select {
            width: 100%; padding: 16px; border: 2px solid #e0e6ed; border-radius: 15px; font-size: 18px;
            font-family: var(--font-vi); transition: 0.3s; background-color: #f8fafc; color: var(--text-dark);
        }
        input.jp-input { font-family: var(--font-jp); font-size: 20px; font-weight: 700; }
        input:focus, select:focus { outline: none; border-color: var(--primary); background-color: white; box-shadow: 0 0 0 4px rgba(0, 176, 155, 0.1); }
        
        button.btn-submit {
            width: 100%; padding: 18px; background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; border: none; border-radius: 15px; font-size: 20px; font-weight: 800; cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 176, 155, 0.3); margin-top: 10px; transition: 0.2s;
        }
        button.btn-submit:active { transform: scale(0.96); }

        /* KHU VỰC LIST TỪ VỰNG & LỊCH XỔ XUỐNG */
        .section-title { font-size: 22px; font-weight: 800; color: var(--text-dark); margin-bottom: 20px; text-align: center; }
        
        /* Box chứa Ngày (Accordion) */
        .date-group { margin-bottom: 15px; background: white; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); overflow: hidden; border: 1px solid #edf2f7; }
        .date-header {
            padding: 18px 20px; background: linear-gradient(to right, #ffffff, #f8fafc); display: flex; justify-content: space-between; align-items: center;
            font-size: 18px; font-weight: 800; color: var(--primary); cursor: pointer; user-select: none;
        }
        .date-header i { font-size: 20px; color: #cbd5e1; transition: 0.3s; }
        .date-group.open .date-header i { transform: rotate(180deg); color: var(--primary); }
        
        .date-content { display: none; padding: 15px; background: #f8fafc; }
        .date-group.open .date-content { display: block; animation: slideDown 0.3s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* Thẻ từ vựng (Card xổ xuống) */
        .word-card { background: white; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.04); margin-bottom: 12px; border-left: 5px solid var(--secondary); overflow: hidden; }
        .word-card:last-child { margin-bottom: 0; }
        
        .word-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .w-jp { font-size: 26px; font-weight: 900; color: var(--text-dark); display: block; line-height: 1.2; margin-bottom: 5px; }
        .w-vi { font-size: 18px; font-weight: 600; color: var(--text-gray); display: block; }
        .w-icon { font-size: 20px; color: #cbd5e1; transition: 0.3s; }
        .word-card.open .w-icon { transform: rotate(180deg); color: var(--secondary); }

        .word-body {
            max-height: 0; overflow: hidden; transition: max-height 0.3s ease, padding 0.3s ease;
            background-color: #ffffff; border-top: 1px dashed transparent; padding: 0 20px;
        }
        .word-card.open .word-body { max-height: 500px; padding: 18px 20px; border-top-color: #e2e8f0; }

        .detail-item { font-size: 17px; margin-bottom: 12px; line-height: 1.5; color: var(--text-dark); }
        .detail-item span.label { font-weight: 800; color: var(--primary); display: inline-block; min-width: 85px; font-size: 15px; text-transform: uppercase; letter-spacing: 0.5px;}
        
        /* Nút Loa */
        .speaker-box { display: flex; align-items: center; gap: 10px; }
        .speaker-btn {
            background: #e0f2fe; color: #0284c7; border: none; width: 38px; height: 38px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-size: 16px;
        }
        .speaker-btn:active { transform: scale(0.85); }

        /* NÚT BACK TO TOP */
        #backToTop {
            position: fixed; bottom: 25px; right: 25px; width: 55px; height: 55px;
            background: var(--text-dark); color: white; border: none; border-radius: 50%;
            font-size: 22px; box-shadow: 0 6px 15px rgba(0,0,0,0.3); display: none; z-index: 99;
            align-items: center; justify-content: center;
        }

        .loading-screen { text-align: center; padding: 50px 20px; color: var(--text-gray); font-size: 18px; font-weight: bold;}
        .loading-screen i { color: var(--primary); margin-bottom: 20px; }

    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <button class="menu-btn" onclick="toggleMenu()"><i class="fas fa-bars"></i></button>
        <h1>SHOKAIMONO</h1>
        <div style="width: 26px;"></div>
    </nav>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="close-btn" onclick="toggleMenu()"><i class="fas fa-times"></i></button>
            <h2>MENU</h2>
        </div>
        <ul class="nav-links">
            <li onclick="switchTab('addSection')"><i class="fas fa-pen-nib"></i> Thêm từ mới</li>
            <li onclick="loadVocab('VOCAB')"><i class="fas fa-book-open"></i> Học VOCAB</li>
            <li onclick="loadVocab('ニュース')"><i class="fas fa-newspaper"></i> Học ニュース</li>
        </ul>
    </div>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <main class="container">
        
        <!-- SECTION 1: THÊM TỪ MỚI -->
        <section id="addSection" class="active">
            <div class="card">
                <div class="input-group">
                    <label>📂 Lưu vào thư mục</label>
                    <select id="tabSelect">
                        <option value="VOCAB">Thẻ VOCAB</option>
                        <option value="ニュース">Thẻ ニュース</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>🇯🇵 Từ vựng (Kanji / Kana)</label>
                    <input type="text" id="word" class="jp-input" placeholder="VD: 会社">
                </div>
                <div class="input-group">
                    <label>🇻🇳 Ý nghĩa</label>
                    <input type="text" id="meaning" class="vi-text" placeholder="VD: Công ty">
                </div>
                <div class="input-group">
                    <label>🏷️ Từ loại</label>
                    <input type="text" id="type" class="vi-text" placeholder="VD: Danh từ">
                </div>
                <div class="input-group">
                    <label>🗣️ Cách đọc</label>
                    <input type="text" id="pronun" class="jp-input" placeholder="VD: かいしゃ">
                </div>
                <div class="input-group">
                    <label>📝 Câu ví dụ</label>
                    <input type="text" id="example" class="jp-input" placeholder="VD: 会社に行きます。">
                </div>
                
                <button class="btn-submit" onclick="addWord()"><i class="fas fa-save"></i> LƯU TỪ VỰNG</button>
            </div>
        </section>

        <!-- SECTION 2: LIST TỪ VỰNG THEO NGÀY (ACCORDION) -->
        <section id="listSection">
            <h3 id="listTitle" class="section-title"></h3>
            <div id="wordListContainer"></div>
        </section>

    </main>

    <button id="backToTop" onclick="scrollToTop()"><i class="fas fa-arrow-up"></i></button>

    <script>
        // === LINK APP SCRIPT CỦA BẠN ===
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxZvWQlBHe7W7o9CYqM8_ADuaxygAppoJ4mt-IbcaJ7eJRjlcGs8XhV4eX0LU6F821n/exec'; 

        function toggleMenu() {
            document.getElementById("sidebar").classList.toggle("active");
            document.getElementById("overlay").classList.toggle("active");
        }

        function switchTab(sectionId) {
            document.getElementById('addSection').classList.remove('active');
            document.getElementById('listSection').classList.remove('active');
            document.getElementById(sectionId).classList.add('active');
            if(document.getElementById("sidebar").classList.contains("active")) toggleMenu();
        }

        function addWord() {
            let tab = document.getElementById('tabSelect').value;
            let word = document.getElementById('word').value.trim();
            let meaning = document.getElementById('meaning').value.trim();
            let type = document.getElementById('type').value.trim();
            let pronun = document.getElementById('pronun').value.trim();
            let example = document.getElementById('example').value.trim();

            if (!word || !meaning) {
                alert("Vui lòng nhập ít nhất Từ vựng và Ý nghĩa!"); return;
            }

            let btn = document.querySelector('.btn-submit');
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> ĐANG LƯU...';
            btn.disabled = true;

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `tab=${tab}&word=${word}&meaning=${meaning}&type=${type}&pronun=${pronun}&example=${example}`
            }).then(response => {
                alert("🎉 Lưu thành công!");
                document.getElementById('word').value = "";
                document.getElementById('meaning').value = "";
                document.getElementById('type').value = "";
                document.getElementById('pronun').value = "";
                document.getElementById('example').value = "";
                btn.innerHTML = '<i class="fas fa-save"></i> LƯU TỪ VỰNG';
                btn.disabled = false;
            }).catch(err => {
                alert("Lỗi mạng rồi, thử lại nha!");
                btn.innerHTML = '<i class="fas fa-save"></i> LƯU TỪ VỰNG';
                btn.disabled = false;
            });
        }

        // Tải dữ liệu
        function loadVocab(tabName) {
            switchTab('listSection');
            document.getElementById('listTitle').innerText = `📚 THƯ MỤC: ${tabName}`;
            document.getElementById('wordListContainer').innerHTML = `<div class="loading-screen"><i class="fas fa-spinner fa-spin fa-3x"></i><p>Đang đồng bộ dữ liệu...</p></div>`;

            fetch(SCRIPT_URL + "?tab=" + tabName)
                .then(res => res.json())
                .then(data => {
                    processData(data);
                }).catch(err => {
                    document.getElementById('wordListContainer').innerHTML = `<p style="text-align:center; color: red;">Lỗi tải dữ liệu. Vui lòng thử lại.</p>`;
                });
        }

        // Xử lý và Gom nhóm theo ngày
        function processData(data) {
            let groupedByDate = {};
            
            // i = 1 để bỏ qua hàng tiêu đề trong Sheet
            for (let i = 1; i < data.length; i++) {
                let row = data[i];
                if (!row[0]) continue; // Bỏ qua nếu cột Từ vựng bị trống
                
                // Lấy ngày, nếu trống thì đưa vào mục Chưa phân loại
                let dateStr = row[2] ? row[2].toString().substring(0, 10) : "Chưa phân loại"; 
                
                if(!groupedByDate[dateStr]) groupedByDate[dateStr] = [];
                groupedByDate[dateStr].push({
                    word: row[0] || "",
                    meaning: row[1] || "",
                    type: row[3] || "---",
                    pronun: row[4] || "---",
                    example: row[5] || "---"
                });
            }
            renderAccordions(groupedByDate);
        }

        // In ra màn hình dạng Accordion giữ nguyên các ngày
        function renderAccordions(groupedByDate) {
            let container = document.getElementById('wordListContainer');
            container.innerHTML = "";
            
            let dates = Object.keys(groupedByDate).sort((a,b) => {
                if(a === "Chưa phân loại") return 1;
                return new Date(b.split('/').reverse().join('-')) - new Date(a.split('/').reverse().join('-'));
            });

            if(dates.length === 0) {
                container.innerHTML = `<p style="text-align:center;">Chưa có từ vựng nào trong thư mục này.</p>`;
                return;
            }

            let html = "";
            dates.forEach((date, index) => {
                let words = groupedByDate[date].reverse(); // Từ mới nhất của ngày đó lên đầu
                let isOpen = index === 0 ? "open" : ""; // Mặc định xổ xuống ngày mới nhất đầu tiên

                html += `
                <div class="date-group ${isOpen}">
                    <div class="date-header" onclick="toggleDateGroup(this)">
                        <span>📅 ${date} <span style="font-size:14px; color:#636e72;">(${words.length} từ)</span></span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                    <div class="date-content">
                `;

                words.forEach(w => {
                    html += `
                    <div class="word-card">
                        <div class="word-header" onclick="toggleCard(this)">
                            <div>
                                <span class="w-jp jp-text">${w.word}</span>
                                <span class="w-vi vi-text">${w.meaning}</span>
                            </div>
                            <i class="fas fa-chevron-down w-icon"></i>
                        </div>
                        <div class="word-body">
                            <div class="detail-item"><span class="label">Từ loại:</span> <span class="vi-text">${w.type}</span></div>
                            
                            <div class="detail-item speaker-box">
                                <span class="label">Cách đọc:</span> <span class="jp-text" style="font-size: 19px;">${w.pronun}</span>
                                <!-- NÚT LOA Ở ĐÂY SẼ ĐỌC TỪ VỰNG CHÍNH (w.word) -->
                                ${w.pronun !== "---" ? `<button class="speaker-btn" onclick="speakText('${w.word}')"><i class="fas fa-volume-up"></i></button>` : ''}
                            </div>

                            <div class="detail-item"><span class="label">Ví dụ:</span> <span class="jp-text" style="font-size: 18px;">${w.example}</span></div>
                        </div>
                    </div>`;
                });

                html += `</div></div>`;
            });

            container.innerHTML = html;
        }

        // Đóng/mở nhóm Ngày
        function toggleDateGroup(headerEl) {
            headerEl.parentElement.classList.toggle('open');
        }

        // Đóng/mở chi tiết Từ vựng
        function toggleCard(headerEl) {
            let card = headerEl.parentElement;
            // Dòng này giúp đóng các từ khác khi mở 1 từ. Nếu muốn mở cùng lúc nhiều từ thì xóa dòng dưới đi.
            card.parentElement.querySelectorAll('.word-card').forEach(c => { if(c !== card) c.classList.remove('open'); });
            card.classList.toggle('open');
        }

        // Phát âm từ vựng (Sử dụng Từ Kanji chính)
        function speakText(text) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP'; 
            utterance.rate = 0.9; // Đọc chậm lại một xíu cho rõ
            window.speechSynthesis.speak(utterance);
        }

        // Scroll to Top
        window.onscroll = function() {
            let backBtn = document.getElementById("backToTop");
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                backBtn.style.display = "flex";
            } else {
                backBtn.style.display = "none";
            }
        };
        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
    </script>
</body>
</html>
