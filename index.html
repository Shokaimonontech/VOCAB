<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHOKAIMONO 🌸</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-app: #e0f2fe; 
            --primary: #38bdf8; 
            --secondary: #7dd3fc; 
            --accent: #f472b6; 
            --success: #10b981; 
            --warning: #f59e0b;
            --text-dark: #1e293b;
            --text-gray: #475569;
            --card-bg: #ffffff;
            --font-vi: 'Nunito', sans-serif;
            --font-jp: 'M PLUS Rounded 1c', sans-serif; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font-vi);
            background-color: var(--bg-app);
            background-image: radial-gradient(circle at top right, #f0f9ff 0%, #e0f2fe 100%);
            color: var(--text-dark);
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        .jp-text { font-family: var(--font-jp) !important; }
        .vi-text { font-family: var(--font-vi) !important; }

        .navbar {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: fixed;
            top: 0; width: 100%; z-index: 100;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4);
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
        }

        .navbar h1 { font-family: var(--font-vi); font-size: 26px; font-weight: 900; letter-spacing: 2px; }
        .menu-btn { font-family: var(--font-vi); background: none; border: none; font-size: 30px; color: white; cursor: pointer; }

        .sidebar {
            position: fixed; top: 0; left: -340px; width: 320px; height: 100vh;
            background-color: white; z-index: 200; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 5px 0 25px rgba(0,0,0,0.1); border-top-right-radius: 30px; border-bottom-right-radius: 30px;
            overflow-y: auto;
        }
        .sidebar.active { left: 0; }
        .sidebar-header {
            padding: 45px 20px 30px 20px; background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; border-top-right-radius: 30px; text-align: center; position: relative;
        }
        .close-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; color: white; font-size: 28px;}
        .nav-links { list-style: none; padding: 20px; }
        .nav-links li {
            padding: 18px; margin-bottom: 15px; border-radius: 20px; font-size: 19px; font-weight: 800;
            color: var(--text-dark); display: flex; align-items: center; gap: 15px; transition: 0.2s;
            background: #f0f9ff; border: 2px solid #bae6fd; cursor: pointer; font-family: var(--font-vi);
        }
        .nav-links li:active { background-color: #e0f2fe; transform: scale(0.95); }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); z-index: 150; display: none; opacity: 0; transition: 0.3s; backdrop-filter: blur(2px); }
        .overlay.active { display: block; opacity: 1; }

        .container { margin-top: 100px; padding: 0 15px; max-width: 650px; margin-left: auto; margin-right: auto; }
        section { display: none; animation: fadeIn 0.4s; }
        section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--card-bg); padding: 30px 25px; border-radius: 30px; box-shadow: 0 10px 40px rgba(56, 189, 248, 0.15); border: 3px solid #f0f9ff; }
        .input-group { margin-bottom: 22px; }
        .input-group label { display: block; font-size: 18px; font-weight: 900; color: var(--primary); margin-bottom: 10px; font-family: var(--font-vi);}
        input, select {
            width: 100%; padding: 18px; border: 2px solid #bae6fd; border-radius: 20px; font-size: 20px;
            font-family: var(--font-vi); transition: 0.3s; background-color: #f8fafc; color: var(--text-dark); font-weight: 700;
        }
        input.jp-input { font-family: var(--font-jp); font-size: 22px; font-weight: 700; }
        input:focus, select:focus { outline: none; border-color: var(--accent); background-color: white; box-shadow: 0 0 0 5px rgba(244, 114, 182, 0.15); }
        
        button { font-family: var(--font-vi) !important; }
        button.btn-submit {
            width: 100%; padding: 20px; background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; border: none; border-radius: 20px; font-size: 22px; font-weight: 900; cursor: pointer;
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4); margin-top: 15px; transition: 0.2s; letter-spacing: 1px;
        }
        button.btn-submit:active { transform: scale(0.95); }

        .section-title { font-size: 24px; font-weight: 900; color: var(--primary); margin-bottom: 25px; text-align: center; text-transform: uppercase; letter-spacing: 1px;}
        
        .month-group { margin-bottom: 20px; background: white; border-radius: 25px; box-shadow: 0 6px 20px rgba(56, 189, 248, 0.1); border: 2px solid #e0f2fe; overflow: hidden; }
        .month-header {
            padding: 20px 25px; background: linear-gradient(to right, #f0f9ff, #ffffff); display: flex; justify-content: space-between; align-items: center;
            font-size: 22px; font-weight: 900; color: var(--primary); cursor: pointer; user-select: none;
        }
        .toggle-icon { font-size: 20px; transition: 0.3s; }
        .month-group.open > .month-header .toggle-icon { transform: rotate(180deg); color: var(--accent); }
        .month-content { display: none; padding: 15px; background: #f8fafc; }
        .month-group.open > .month-content { display: block; animation: slideDown 0.3s ease-out; }

        .date-group { margin-bottom: 15px; background: white; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 2px solid #f1f5f9; overflow: hidden; }
        .date-header {
            padding: 16px 20px; background: #ffffff; display: flex; justify-content: space-between; align-items: center;
            font-size: 19px; font-weight: 800; color: var(--text-dark); cursor: pointer;
        }
        .date-group.open > .date-header .toggle-icon { transform: rotate(180deg); color: var(--primary); }
        .date-content { display: none; padding: 15px; background: #f8fafc; }
        .date-group.open > .date-content { display: block; }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .word-card { background: white; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; border-left: 6px solid var(--accent); overflow: hidden; position: relative;}
        .word-card:last-child { margin-bottom: 0; }
        
        .word-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .w-jp { font-size: 34px; font-weight: 900; color: var(--text-dark); display: block; line-height: 1.2;}
        .w-new-badge { font-size: 14px; background: #fef08a; color: #ca8a04; padding: 4px 8px; border-radius: 10px; font-weight: 800; margin-left: 10px; vertical-align: middle; font-family: var(--font-vi);}
        .w-done-badge { font-size: 14px; background: #d1fae5; color: #047857; padding: 4px 8px; border-radius: 10px; font-weight: 800; margin-left: 10px; vertical-align: middle; font-family: var(--font-vi);}
        
        .word-card.open .word-header .toggle-icon { transform: rotate(180deg); color: var(--accent); }

        .word-body {
            max-height: 0; overflow: hidden; transition: max-height 0.4s ease, padding 0.3s ease;
            background-color: #ffffff; border-top: 1px dashed transparent; padding: 0 20px;
        }
        .word-card.open .word-body { max-height: 1500px; padding: 20px; border-top-color: #e2e8f0; }

        .detail-item { font-size: 20px; margin-bottom: 16px; line-height: 1.6; color: var(--text-dark); }
        .detail-item span.label { font-weight: 900; color: var(--primary); display: inline-block; min-width: 100px; font-size: 18px; text-transform: uppercase; font-family: var(--font-vi);}
        
        .action-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .btn-action {
            width: 100%; padding: 15px; border: none; border-radius: 15px; font-size: 18px; 
            font-weight: 900; cursor: pointer; transition: 0.2s;
        }
        .btn-success { background: var(--success); color: white; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
        .btn-undo { background: #cbd5e1; color: #1e293b; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-link { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4); }
        .btn-action:active { transform: scale(0.97); }

        .num-bullet { color: var(--accent); font-weight: 900; font-size: 22px; margin-right: 5px; font-family: var(--font-vi);}

        .speaker-box { display: flex; align-items: center; gap: 12px; }
        .speaker-btn {
            background: #e0f2fe; color: var(--primary); border: none; width: 45px; height: 45px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 10px rgba(56, 189, 248, 0.2); font-size: 22px;
        }
        .speaker-btn:active { transform: scale(0.85); background: var(--primary); color: white;}

        #backToTop {
            position: fixed; bottom: 30px; right: 25px; width: 60px; height: 60px;
            background: var(--accent); color: white; border: none; border-radius: 50%;
            font-size: 26px; box-shadow: 0 6px 20px rgba(244, 114, 182, 0.4); display: none; z-index: 99;
            align-items: center; justify-content: center; transition: 0.3s; cursor: pointer;
        }
        #backToTop:active { transform: scale(0.9); }

        .loading-screen { text-align: center; padding: 60px 20px; color: var(--primary); font-size: 22px; font-weight: 900; font-family: var(--font-vi);}

    </style>
</head>
<body>

    <nav class="navbar">
        <button class="menu-btn" onclick="toggleMenu()">🎀</button>
        <h1>SHOKAIMONO</h1>
        <div style="width: 30px;"></div>
    </nav>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="close-btn" onclick="toggleMenu()">✖</button>
            <h2 style="font-size: 26px; font-weight: 900; font-family: var(--font-vi);">MENU ☁️</h2>
        </div>
        <ul class="nav-links">
            <li onclick="switchTab('addSection')">🌱 Thêm mới</li>
            <li onclick="loadVocab('Mới_VOCAB', 'VOCAB')">🏵️ Mới VOCAB</li>
            <li onclick="loadVocab('Mới_ニュース', 'ニュース')">🏵️ Mới ニュース</li>
            <li onclick="loadVocab('VOCAB', 'VOCAB')">🌸 Kho VOCAB</li>
            <li onclick="loadVocab('ニュース', 'ニュース')">💮 Kho ニュース</li>
        </ul>
    </div>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <main class="container">
        
        <section id="addSection" class="active">
            <div class="card">
                <div class="input-group">
                    <label>🌸 Chọn nơi lưu (Kho gốc)</label>
                    <select id="tabSelect">
                        <option value="VOCAB">🌸 VOCAB</option>
                        <option value="ニュース">💮 ニュース</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>🇯🇵 Từ vựng (Kanji / Kana / Tiếng Anh)</label>
                    <input type="text" id="word" class="jp-input" placeholder="VD: 会社 hoặc Hello">
                </div>
                <div class="input-group">
                    <label>📝 Câu ví dụ</label>
                    <input type="text" id="example" class="jp-input" placeholder="VD: 1. Ví dụ một. 2. Ví dụ hai.">
                </div>
                <div class="input-group">
                    <label>🇻🇳 Ý nghĩa</label>
                    <input type="text" id="meaning" class="vi-text" placeholder="VD: Công ty">
                </div>
                <div class="input-group">
                    <label>🏷️ Loại từ (Danh/Động/Tính)</label>
                    <input type="text" id="type" class="vi-text" placeholder="VD: Danh từ">
                </div>
                <div class="input-group">
                    <label>🗣️ Cách đọc</label>
                    <input type="text" id="pronun" class="jp-input" placeholder="VD: かいしゃ">
                </div>
                
                <button class="btn-submit" onclick="addWord()">🌸 LƯU VÀO SỔ TAY 🌸</button>
            </div>
        </section>

        <section id="listSection">
            <h3 id="listTitle" class="section-title"></h3>
            <div id="wordListContainer"></div>
        </section>

    </main>

    <button id="backToTop" onclick="scrollToTop()">🌸</button>

    <script>
        // === LINK APP SCRIPT CỦA BẠN ===
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw9HeNZEnE-kqo-wJePWhnoUiqin3kQbcf9LX4WppLtfwgPEwM5BxXlAkAVtfc5MyJi/exec'; 

        let currentViewMode = ""; // Lưu trạng thái tab đang xem (VD: Mới_VOCAB, VOCAB)
        let currentSourceTab = ""; // Lưu Sheet đang truy xuất (VD: VOCAB, ニュース)

        function toggleMenu() {
            document.getElementById("sidebar").classList.toggle("active");
            document.getElementById("overlay").classList.toggle("active");
        }

        function switchTab(sectionId) {
            document.getElementById('addSection').classList.remove('active');
            document.getElementById('listSection').classList.remove('active');
            document.getElementById(sectionId).classList.add('active');
            if(document.getElementById("sidebar").classList.contains("active")) toggleMenu();
        }

        function addWord() {
            let tab = document.getElementById('tabSelect').value;
            let word = document.getElementById('word').value.trim();
            let meaning = document.getElementById('meaning').value.trim();
            let type = document.getElementById('type').value.trim();
            let pronun = document.getElementById('pronun').value.trim();
            let example = document.getElementById('example').value.trim();

            if (!word || !meaning) {
                alert("Viết xíu Từ vựng với Ý nghĩa vào đi! 🌸"); return;
            }

            let btn = document.querySelector('.btn-submit');
            btn.innerHTML = '⏳ ĐANG LƯU NÈ...';
            btn.disabled = true;

            let bodyData = `action=add&tab=${encodeURIComponent(tab)}&word=${encodeURIComponent(word)}&meaning=${encodeURIComponent(meaning)}&type=${encodeURIComponent(type)}&pronun=${encodeURIComponent(pronun)}&example=${encodeURIComponent(example)}`;

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: bodyData
            }).then(response => {
                alert("🎉 Lưu thành công!\nTừ sẽ về thẳng Kho Gốc và tự động hiển thị trong Tab Mới tương ứng.");
                document.getElementById('word').value = "";
                document.getElementById('meaning').value = "";
                document.getElementById('type').value = "";
                document.getElementById('pronun').value = "";
                document.getElementById('example').value = "";
                btn.innerHTML = '🌸 LƯU VÀO SỔ TAY 🌸';
                btn.disabled = false;
            }).catch(err => {
                alert("Mạng lỗi rồi, thử lại nhé!");
                btn.innerHTML = '🌸 LƯU VÀO SỔ TAY 🌸';
                btn.disabled = false;
            });
        }

        // TẢI DỮ LIỆU TỪ SHEET
        function loadVocab(viewMode, sourceTab) {
            currentViewMode = viewMode; 
            currentSourceTab = sourceTab;
            switchTab('listSection');
            
            // Xử lý tiêu đề hiển thị
            let displayTitle = viewMode.startsWith("Mới") ? `🏵️ TAB MỚI: ${sourceTab}` : `🌸 KHO: ${sourceTab}`;
            document.getElementById('listTitle').innerText = displayTitle;
            
            document.getElementById('wordListContainer').innerHTML = `<div class="loading-screen">⏳<br>Đang tải dữ liệu...</div>`;

            fetch(SCRIPT_URL + "?tab=" + sourceTab)
                .then(res => res.json())
                .then(data => {
                    processData(data, viewMode, sourceTab);
                }).catch(err => {
                    document.getElementById('wordListContainer').innerHTML = `<p style="text-align:center; color: red; font-size:20px;">Lỗi mạng. Tải lại trang dùm cái!</p>`;
                });
        }

        function formatLineBreaks(text) {
            if (!text) return "";
            let formatted = text.replace(/(?:\s|^)(\d+[\.\)])/g, '<br><br><span class="num-bullet">$1</span>');
            formatted = formatted.replace(/^(<br>)+/, '').trim();
            return formatted;
        }

        // PHÂN LOẠI & LỌC TỪ
        function processData(data, viewMode, sourceTab) {
            let groupedData = {}; 
            
            for (let i = 1; i < data.length; i++) {
                let row = data[i];
                if (!row[0]) continue; 
                
                let status = row[6] || ""; // Cột 7 (G) lưu trạng thái "Đã nhớ"
                
                // LỌC: Nếu đang ở Tab Mới -> Bỏ qua các từ "Đã nhớ"
                if (viewMode.startsWith("Mới") && status === "Đã nhớ") {
                    continue; 
                }

                let rawDate = row[2] ? row[2].toString().substring(0, 10) : "Khác";
                let dateStr = rawDate;
                let monthStr = "Chưa phân loại";

                if (rawDate !== "Khác") {
                    let parts = rawDate.includes('/') ? rawDate.split('/') : rawDate.split('-');
                    if (parts.length >= 3) {
                        if (rawDate.includes('/')) {
                            monthStr = "Tháng " + parts[1] + "/" + parts[2]; 
                        } else {
                            monthStr = "Tháng " + parts[1] + "/" + parts[0]; 
                        }
                    }
                }

                if (!groupedData[monthStr]) groupedData[monthStr] = {};
                if (!groupedData[monthStr][dateStr]) groupedData[monthStr][dateStr] = [];

                groupedData[monthStr][dateStr].push({
                    word: row[0] || "",
                    meaning: formatLineBreaks(row[1] || ""), 
                    type: row[3] || "---",
                    pronun: row[4] || "---",
                    example: formatLineBreaks(row[5] || ""),
                    status: status
                });
            }
            renderNestedAccordions(groupedData, viewMode, sourceTab);
        }

        // RENDER GIAO DIỆN
        function renderNestedAccordions(groupedData, viewMode, sourceTab) {
            let container = document.getElementById('wordListContainer');
            container.innerHTML = "";
            
            let months = Object.keys(groupedData).sort((a,b) => {
                if(a === "Chưa phân loại") return 1;
                return b.localeCompare(a); 
            });

            if(months.length === 0) {
                container.innerHTML = `<p style="text-align:center; font-size:20px; font-weight:800; color:var(--text-gray);">Tuyệt vời! Không còn từ nào chưa thuộc. 🌸</p>`;
                return;
            }

            let html = "";
            months.forEach((month, mIndex) => {
                let isMonthOpen = mIndex === 0 ? "open" : ""; 
                
                html += `
                <div class="month-group ${isMonthOpen}">
                    <div class="month-header" onclick="toggleParent(this, 'month-group')">
                        <span>🎀 ${month}</span>
                        <span class="toggle-icon">🔽</span>
                    </div>
                    <div class="month-content">
                `;

                let dates = Object.keys(groupedData[month]).sort((a,b) => {
                    return new Date(b.split('/').reverse().join('-')) - new Date(a.split('/').reverse().join('-'));
                });

                dates.forEach((date, dIndex) => {
                    let words = groupedData[month][date].reverse();
                    let isDateOpen = (mIndex === 0 && dIndex === 0) ? "open" : ""; 

                    html += `
                    <div class="date-group ${isDateOpen}">
                        <div class="date-header" onclick="toggleParent(this, 'date-group')">
                            <span>📅 Ngày ${date} <span style="color:#94a3b8; font-size: 16px;">(${words.length} từ)</span></span>
                            <span class="toggle-icon">🔽</span>
                        </div>
                        <div class="date-content">
                    `;

                    words.forEach(w => {
                        // Badge hiển thị dựa trên trạng thái (Áp dụng cho Kho)
                        let badgeHtml = "";
                        if (w.status === "Đã nhớ") {
                            badgeHtml = `<span class="w-done-badge">Đã nhớ</span>`;
                        } else {
                            badgeHtml = `<span class="w-new-badge">Chưa thuộc</span>`;
                        }

                        // Xử lý Render Nút bấm động
                        let actionButtonsHtml = "";
                        if (w.status === "Đã nhớ") {
                            actionButtonsHtml += `<button class="btn-action btn-undo" onclick="updateStatus('${w.word}', '', this, '${viewMode}')">↩️ Đánh dấu Chưa thuộc (Hoàn tác)</button>`;
                        } else {
                            actionButtonsHtml += `<button class="btn-action btn-success" onclick="updateStatus('${w.word}', 'Đã nhớ', this, '${viewMode}')">✅ Đã thuộc</button>`;
                        }

                        // Nếu ở tab Mới -> Có nút quay về Kho gốc
                        if (viewMode.startsWith("Mới")) {
                            actionButtonsHtml += `<button class="btn-action btn-link" onclick="loadVocab('${sourceTab}', '${sourceTab}')">🔗 Tới kho gốc: ${sourceTab}</button>`;
                        }

                        html += `
                        <div class="word-card">
                            <div class="word-header" onclick="toggleParent(this, 'word-card')">
                                <div>
                                    <span class="w-jp jp-text">${w.word} ${badgeHtml}</span>
                                </div>
                                <span class="toggle-icon">🔽</span>
                            </div>
                            <div class="word-body">
                                <div class="detail-item speaker-box">
                                    <span class="label">Đọc:</span> <span class="jp-text" style="font-size: 24px; font-weight:900; color:var(--primary);">${w.pronun}</span>
                                    ${w.pronun !== "---" ? `<button class="speaker-btn" onclick="detectLangAndSpeak('${w.word}')">🔊</button>` : ''}
                                </div>
                                <div class="detail-item"><span class="label">Từ loại:</span> <span class="vi-text" style="font-weight:700;">${w.type}</span></div>
                                <div class="detail-item"><span class="label">Ví dụ:</span> <div class="jp-text" style="font-size: 22px; padding-top: 5px;">${w.example}</div></div>
                                
                                <hr style="border-top: 2px dashed #bae6fd; margin: 20px 0;">
                                <div class="detail-item"><span class="label" style="color:var(--accent);">Ý nghĩa:</span> <span class="vi-text" style="font-weight:800;">${w.meaning}</span></div>
                                
                                <!-- Hàng nút chức năng -->
                                <div class="action-buttons">
                                    ${actionButtonsHtml}
                                </div>
                            </div>
                        </div>`;
                    });

                    html += `</div></div>`; 
                });
                html += `</div></div>`; 
            });

            container.innerHTML = html;
        }

        // HÀM CẬP NHẬT TRẠNG THÁI (Đã thuộc / Hoàn tác)
        function updateStatus(wordToMark, newStatus, btnElement, viewMode) {
            let originalText = btnElement.innerText;
            btnElement.innerHTML = '⏳ Đang xử lý...';
            btnElement.disabled = true;

            let bodyData = `action=update_status&word=${encodeURIComponent(wordToMark)}&status=${encodeURIComponent(newStatus)}`;

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: bodyData
            }).then(response => {
                // Nếu đang ở Tab Mới và bấm "Đã thuộc", thì ẩn Card đó đi
                if (viewMode.startsWith("Mới") && newStatus === "Đã nhớ") {
                    let card = btnElement.closest('.word-card');
                    card.style.transition = "0.4s";
                    card.style.opacity = "0";
                    setTimeout(() => card.remove(), 400);
                } else {
                    // Nếu ở tab Kho, đổi thiết kế nút và Badge
                    let actionBox = btnElement.closest('.action-buttons');
                    let badgeArea = btnElement.closest('.word-card').querySelector('.word-header div');
                    
                    if (newStatus === "Đã nhớ") {
                        badgeArea.innerHTML = `<span class="w-jp jp-text">${wordToMark} <span class="w-done-badge">Đã nhớ</span></span>`;
                        actionBox.innerHTML = `<button class="btn-action btn-undo" onclick="updateStatus('${wordToMark}', '', this, '${viewMode}')">↩️ Đánh dấu Chưa thuộc (Hoàn tác)</button>` + (actionBox.innerHTML.includes('🔗') ? `<button class="btn-action btn-link" onclick="loadVocab('${currentSourceTab}', '${currentSourceTab}')">🔗 Tới kho gốc: ${currentSourceTab}</button>` : '');
                    } else {
                        badgeArea.innerHTML = `<span class="w-jp jp-text">${wordToMark} <span class="w-new-badge">Chưa thuộc</span></span>`;
                        actionBox.innerHTML = `<button class="btn-action btn-success" onclick="updateStatus('${wordToMark}', 'Đã nhớ', this, '${viewMode}')">✅ Đã thuộc</button>` + (actionBox.innerHTML.includes('🔗') ? `<button class="btn-action btn-link" onclick="loadVocab('${currentSourceTab}', '${currentSourceTab}')">🔗 Tới kho gốc: ${currentSourceTab}</button>` : '');
                    }
                }
            }).catch(err => {
                alert("Lỗi mạng rồi. Thử lại sau nha!");
                btnElement.innerHTML = originalText;
                btnElement.disabled = false;
            });
        }

        function toggleParent(headerEl, parentClass) {
            let parentBox = headerEl.closest('.' + parentClass);
            parentBox.classList.toggle('open');
        }

        // HÀM PHÁT ÂM CHUẨN XÁC
        function detectLangAndSpeak(text) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            
            // Xử lý phát âm chính xác tuyệt đối theo Tab
            if (currentSourceTab === "VOCAB") {
                utterance.lang = 'en-US'; // 100% Tiếng Anh cho VOCAB
            } else if (currentSourceTab === "ニュース") {
                utterance.lang = 'ja-JP'; // 100% Tiếng Nhật cho ニュース
            } 
            
            utterance.rate = 0.85; 
            window.speechSynthesis.speak(utterance);
        }

        window.onscroll = function() {
            let backBtn = document.getElementById("backToTop");
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                backBtn.style.display = "flex";
            } else {
                backBtn.style.display = "none";
            }
        };
        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
    </script>
</body>
</html>
